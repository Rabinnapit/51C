<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B2B Guide</title>
<meta name="description" content="Unofficial step-by-step guide for new Army 51C contracting NCOs and 1102 contract specialists working toward the DoW Contracting Professional certification: plan, courses, lessons, practice exam, flashcards and glossary.">
<meta name="theme-color" content="#1f5e46">
<!--@icon-->
<!--@webhead-->
<script id="embeddedState" type="application/json">null</script>
<script>
/* Runs before first paint: theme, text size and a collapsed side menu. Reader's choice > choice saved in this file > day
   (the default). Night is 'dark'; 'system' follows the device. */
(function () {
  var d = document.documentElement, t = null, s = null, es = null, side = null;
  try { es = JSON.parse(document.getElementById('embeddedState').textContent || 'null'); } catch (e) {}
  try { t = localStorage.getItem('b2b.theme'); s = localStorage.getItem('b2b.textsize'); side = localStorage.getItem('b2b.side'); } catch (e) {}
  if (!t && es && es.settings && es.settings.theme) t = es.settings.theme;
  if (!s && es && es.settings && es.settings.textSize != null) s = String(es.settings.textSize);
  if (t === 'dark') d.setAttribute('data-theme', 'dark'); else if (t !== 'system') d.setAttribute('data-theme', 'light');
  if (s && /^[0-3]$/.test(s)) d.setAttribute('data-text', s);
  if (side === 'mini') d.setAttribute('data-side', 'mini');
})();
</script>
<!--@styles-->
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<div id="app"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<!--@data-->
<!--@core-->
<!--@views-->
<!--@boot-->
</body>
</html>
