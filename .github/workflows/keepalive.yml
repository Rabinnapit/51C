# Keeps the free Supabase project (accounts and saved progress) awake: the free plan pauses a project after seven
# days without API requests, and paused accounts fail until the owner clicks Restore. A request every third day costs
# nothing (GitHub Actions is free for a public repository). The address and the publishable key come from
# src/data/meta.json, the same public values the app itself uses.
# Note: GitHub switches scheduled workflows off after 60 days without a push to the repository; any push turns it on again.
name: Keep accounts awake
on:
  schedule:
    - cron: '17 9 */3 * *'   # every third day at 09:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the Supabase project
        run: |
          set -e
          URL=$(python3 -c "import json; print(json.load(open('src/data/meta.json'))['sync']['url'])")
          KEY=$(python3 -c "import json; print(json.load(open('src/data/meta.json'))['sync']['key'])")
          curl -sS -o /dev/null -w "auth %{http_code}\n" "$URL/auth/v1/health" -H "apikey: $KEY"
          curl -sS -o /dev/null -w "rest %{http_code}\n" "$URL/rest/v1/progress?select=user_id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          echo "pinged $URL on $(date -u)"
