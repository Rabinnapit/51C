# Builds B2B Exam Prep and Board Ready and publishes both to GitHub Pages on every push to main:
#   https://<owner>.github.io/51C/            B2B Exam Prep (docs/)
#   https://<owner>.github.io/51C/boardready/ Board Ready (docs/boardready/, from boardready/tools/publish_site.py)
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Build and publish B2B Exam Prep and Board Ready

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the content
        run: python tools/check_content.py
      - name: Build the app (web, offline and preview editions)
        run: python tools/build.py
      - name: Make the Word package for Army email
        run: |
          pip install python-docx==1.1.2
          python tools/make_docx.py
      - name: Check, build and package Board Ready
        run: |
          python boardready/tools/check_content.py
          python boardready/tools/build.py
          python boardready/tools/make_docx.py
          python boardready/tools/publish_site.py docs/boardready
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
